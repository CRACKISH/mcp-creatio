name: npm Publish

# Publishes the package to npm when a v*.*.* tag is pushed — no token, no OTP.
# Uses npm trusted publishing (OIDC): npmjs.com trusts THIS workflow file of THIS repo, and the
# registry mints a short-lived credential per run. Provenance is attached automatically.
# One-time setup on npmjs.com → mcp-creatio → Settings → Trusted Publisher → GitHub Actions:
#   owner CRACKISH, repository mcp-creatio, workflow filename npm-publish.yml.
#   - push of a v*.*.* tag  → automatic
#   - workflow_dispatch     → publish an existing tag (run from the Actions tab)
on:
    push:
        tags: ['v*.*.*']
    workflow_dispatch:
        inputs:
            tag:
                description: 'Existing tag to publish, e.g. v0.7.1'
                required: true

permissions:
    contents: read
    id-token: write # the OIDC token npm exchanges for a one-run publish credential

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.inputs.tag || github.ref }}

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org

            # Trusted publishing needs npm >= 11.5.1.
            - name: Update npm
              run: npm install -g npm@11

            - name: Check the tag matches package.json
              id: version
              shell: bash
              run: |
                  TAG="${{ github.event.inputs.tag || github.ref_name }}"
                  VER="$(node -p "require('./package.json').version")"
                  if [ "${TAG#v}" != "$VER" ]; then
                    echo "::error::tag $TAG does not match package.json version $VER"; exit 1
                  fi
                  if npm view "mcp-creatio@$VER" version >/dev/null 2>&1; then
                    echo "mcp-creatio@$VER is already on npm — nothing to publish"
                    echo "published=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Install
              if: steps.version.outputs.published != 'true'
              run: npm ci

            - name: Test
              if: steps.version.outputs.published != 'true'
              run: npm test

            # prepack rebuilds dist/.
            - name: Publish
              if: steps.version.outputs.published != 'true'
              run: npm publish --access public
